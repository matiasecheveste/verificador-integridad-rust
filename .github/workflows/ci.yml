# Verificador de integridad — Matías Nicolás Echeveste Cardozo
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  pruebas:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pruebas
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archivo: verificar
          - os: windows-latest
            archivo: verificar.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/${{ matrix.archivo }}
